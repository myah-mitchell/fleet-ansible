[defaults]
# Forces ansible to lost the hosts.yml file if not already provided
INVENTORY = hosts.yml

# Forces ansible to store tmp files on remote machine in the tmp folder
remote_tmp = /tmp/.ansible-${USER}/tmp

# Installs collections into [current dir]/ansible_collections/namespace/collection_name
collections_paths = ./

# Installs roles into [current dir]/roles/namespace.rolename
roles_path = ./roles

# Loads group_vars and host_vars as usual, and decrypts the ones sops
# encrypted: files ending in .sops.yaml, such as the private repo's
# group_vars/all/secrets.sops.yaml. sops reads the age key from SOPS_AGE_KEY
# or SOPS_AGE_KEY_FILE in the environment.
vars_plugins_enabled = host_group_vars,community.sops.sops

# Future Proof for version 2.24 to remove warning output
inject_facts_as_vars = False

# Silences noisy deprecation warnings that come from ansible-core's own
# internals and from third-party collections (e.g. ansible.posix), not
# from anything in this repo - see ansible-collections/ansible.posix#695
# and #676, and ansible/ansible#86259. Revisit once those land upstream.
deprecation_warnings = False