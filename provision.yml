---

- hosts: "{{ target }}"
  become_user: root
  become: true
  gather_facts: true

  # Everything but target can come from the inventory, per host or per group
  # (all: vars: in hosts.yml for fleet-wide values), or from -e for the whole
  # run. Only what neither sets is asked for, once per run, by the pre_tasks.
  # vars_prompt cannot do that: it always asks unless -e sets the value.
  vars_prompt:
    - name: target
      prompt: |
        Here are the hosts and hostgroups available to run against:
        {{ groups | dict2items | json_query('[?key!=`all` && key!=`ungrouped`]') | items2dict | to_nice_yaml }}
        Please provide host or group patterns with comma-separated,
        or hit Enter for default
      private: no
      default: ubuntu

  vars:
    provision_questions:
      - { name: short_name, default: "MYMI" }
      - { name: abbr_name, default: "mm" }
      - { name: location_abbr, default: "h" }
      - { name: domain_name, default: "myah-mitchell.com" }

  pre_tasks:
    - name: Ask for the values the inventory leaves unset
      ansible.builtin.include_role:
        name: provision
        tasks_from: ask
        apply:
          tags: always
      tags: always

  roles:
    - role: packages
      tags: [ packages, updates ]

    - role: provision
      tags: [ always, provision ]

    - role: users
      tags: users

    - role: certificates
      tags: certificates

    - role: ntp
      tags: ntp

    - role: hostname
      tags: hostname

    - role: mail
      tags: mail

    - role: ssh
      tags: ssh

    - role: vrrp
      tags: vrrp

    - role: pbs
      tags: pbs

    - role: pmg
      tags: pmg

    - role: pve
      tags: pve

    - role: qemu
      tags: qemu

    - role: firewall
      tags: firewall

    - role: mosh
      tags: mosh

    - role: logging
      tags: logging

    - role: swap
      tags: swap

    - role: autoupdate
      tags: [ autoupdate, auto-update ]

    - role: fail2ban
      tags: fail2ban

    - role: nginx
      tags: nginx

    - role: monitoring
      tags: monitoring

    - role: dotfiles
      tags: dotfiles

    - role: auditd
      tags: auditd

    - role: cleanup
      tags: [ always, cleanup ]
