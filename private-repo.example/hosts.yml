all:
  vars:
    # provision.yml's identity values, fleet-wide. A group or host can set its
    # own, and anything set nowhere is asked for when the run starts. A value
    # passed with -e (or in a Semaphore Variable Group's Extra Variables) wins
    # over all of these, so keep them out of there if any host overrides one.
    short_name: "EXAMPLE"
    abbr_name: "ex"
    location_abbr: "h"
    domain_name: "example.com"
    # server_password is a secret, so it lives in
    # group_vars/all/secrets.sops.yaml, not here.

localhosts:
  hosts:
    ubuntu:
      ansible_host: 127.0.0.1

      ntp_service: "chrony"

      FIREWALL: true
      firewall_service: "ufw"

      SWAP: true
      swap_size: "512M"
      swap_file: "/swapfile"

      AUTOUPDATE: true
      NODE_EXPORTER: true

    wsl:
      ansible_host: 127.0.0.1

      AUDITD: false
      AUTOUPDATE: false
      FAIL2BAN: false
      FIREWALL: false
      HOSTNAME: false
      LOGGING: false
      MAIL: false
      MONITORING: false
      NGINX: false
      NTP: false
      QEMU: false
      SSH: false
      SWAP: false
      USERS: true
      users_ansible_setup: false
      users_admin_setup: false
      users_root_setup: false
      VRRP: false

nixos_host:
  hosts:
    # NixOS VMs, built by site.yml. Each docker_stacks list is what the host
    # runs once the site is finished. nixos-sync.yml turns a host's entry into
    # nixos/hosts/<host>.json, which its NixOS configuration is built from, and
    # komodo-sync.yml turns its stacks into komodo/stacks/<host>.toml, which
    # Komodo's Resource Sync reads, so run both and commit their output after
    # any change here. While the fleet is still being built, set
    # docker_stacks_bootstrap: true on a host: system-agent and traefik-agent
    # are then left out, and traefik-bootstrap stands in for the Traefik the
    # host would have had. Remove it at the handover, and run both again.
    km01:
      ansible_host: 192.0.2.101
      serverHostname: "km01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - komodo-server
    tf01:
      ansible_host: 192.0.2.102
      serverHostname: "tf01"
      docker_stacks:
        - system-agent
        - traefik-server
    ci01:
      ansible_host: 192.0.2.103
      serverHostname: "ci01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - semaphore-server
        - victoriametrics-server
        - core-infra
    id01:
      ansible_host: 192.0.2.104
      serverHostname: "id01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - authentik-server
    pk01:
      ansible_host: 192.0.2.105
      serverHostname: "pk01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - step-ca-server
    # The two hosts on the DMZ network set their own gateway.
    bh01:
      ansible_host: 198.51.100.101
      network_gateway: "198.51.100.1"
      serverHostname: "bh01"
      docker_stacks:
        - system-agent
        - traefik-dmz
    mx01:
      ansible_host: 198.51.100.102
      network_gateway: "198.51.100.1"
      serverHostname: "mx01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - stalwart-server
    # A host with a VM in opentofu/prod.tfvars, under its serverHostname, is
    # one site.yml creates: the first run that targets it creates the VM
    # through OpenTofu, installs NixOS on it, and deploys its stacks through
    # Komodo. The hosts above have no VM there in this example, so OpenTofu
    # never touches them. The fleet bootstrap docs give every host one. The
    # VM's address, prefix length and gateway there must match the host here.
    ex01:
      ansible_host: 192.0.2.110
      serverHostname: "ex01"
      docker_stacks:
        - system-agent
        - traefik-agent
  vars:
    NIXOS: true
    network_gateway: "192.0.2.1"
    swap_size_mib: 512
    docker_stacks_internal_subnet: "192.0.2.0/24"

    FIREWALL: true
    DOCKER: true
    KOMODO: true
    NODE_EXPORTER: true

pbs_host:
  hosts:
    bk01:
      ansible_host: 127.0.0.1
      serverHostname: "bk01"

      NTP: true
      ntp_service: "chrony"

      PBS: true
      pbs_enterprise_repo: false
      pbs_interface_primary: "nic0"
      pbs_interface_secondary: ""

      NGINX: true

pmg_host:
  hosts:
    pmg01:
      ansible_host: 127.0.0.1
      serverHostname: "pmg01"

      NTP: true
      ntp_service: "chrony"

      PMG: true
      pmg_enterprise_repo: false
      pmg_interface_primary: "ens18"
      pmg_interface_secondary: ""

      NGINX: true

pve_host:
  hosts:
    # Every PVE host gets the installer ISO on its local storage, which is
    # where a new VM in opentofu/prod.tfvars boots from.
    vh01:
      ansible_host: 203.0.113.11
      serverHostname: "vh01"
      # The host's SSH host key, read at its console with
      # cat /etc/ssh/ssh_host_ed25519_key.pub. install-host logs in here to
      # read a new VM's installer key, and accepts no other key.
      pve_ssh_host_key: "<vh01-ssh-host-key>"
      pve_interfaces:
        mgmt:
          ip: "203.0.113.11"
          cidr: "24"
          gw: "203.0.113.1"

  vars:
    NTP: true
    ntp_service: "chrony"

    PVE: true
    pve_enterprise_repo: false

    pve_interface_names:
      mgmt:
        primary: "enp26s0f0np0"

    NGINX: true
