---
#### private.yml: the fleet's values that are not secret but that the public
#### ansible repo would rather not publish, in one place. This is a starter
#### skeleton: fill in your real values below. Ansible loads it for every host,
#### because it sits in group_vars/all/ next to hosts.yml. Secrets do not go
#### here. They go in secrets.sops.yaml, next to this file, which sops
#### encrypts. See README.md in this folder.

# SSH public keys per account. The ansible keys are what site.yml and
# Semaphore connect with. See roles/nixos/defaults/main.yml and
# roles/users/defaults/main.yml. A NixOS host needs at least one of each, and
# nixos-sync.yml stops without them.
#
# These two are the example keys of nixos-fleet's example fleet, there only so
# this example renders. Replace both with your own before anything is built
# or provisioned from a copy of this file.
admin_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJlfGdV3OUejKj9G9L2B3AdrXvVpRP0Y/YIWRxXt8xYC example-admin"
ansible_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII+LvUx8tun9nH3oBy5YNg4kqFXE43Qbtpjl4cBrvS8W example-deploy"
# client_ssh_public_keys defaults to admin_ssh_public_keys. Only set this if
# the end-user login (client_account) should have a different key than admin:
# client_ssh_public_keys: []

# komodo_core_address: Core's real address, e.g. "https://<km01-ip>:9120"
# during bootstrap (DNS/Traefik don't exist yet for most of the fleet), or
# its real hostname once they do.
komodo_core_address: ""

# Core's own public key. It is not secret, so commit the real value here once
# km01's Core is running. Setting up Komodo shows how to extract it:
# https://myah-mitchell.github.io/docs/fleet-bootstrap/foundation/komodo-setup/#core-key
komodo_core_public_key: ""

# CA certs to trust on every host, as a list of {name, content}. Empty here,
# so no CAs are installed. See roles/certificates/tasks/certificates.yml.
ca_certificates: []

# NTP servers for the NixOS hosts, as a list of names or addresses. Empty
# leaves each host with its own default.
ntp_servers: []

# SSH login banner. The Proxmox hosts frame ssh_legal_banner_name as ASCII art
# above the body. See roles/ssh/defaults/main.yml.
# ssh_legal_banner_name: "{{ short_name }}"
# ssh_legal_banner_body: |
#   Unauthorized access to this system is prohibited.
#   All activity may be monitored and reported.

# The human admin login (not the ansible service account). See
# roles/users/defaults/main.yml.
client_account: "clientuser"

# site.yml: the sub-domain each Komodo Stack's SUB_DOMAIN_NAME gets, with its
# trailing dot, for example "home.". Komodo's API key and secret are
# environment variables. See roles/komodo_stacks/defaults/main.yml.
komodo_stacks_sub_domain_name: ""
