---
# One run from nothing to running stacks, for the hosts in `target`:
#
#   1. vms     creates or updates each host's VM through OpenTofu
#   2. wait    waits for each host to answer on its SSH port
#   3. nixos   installs NixOS where the VM runs the installer, then deploys
#              the host's configuration
#   4. komodo  syncs each host's Stacks into Komodo and waits for them to run
#
# The VMs are described in opentofu/<env>.tfvars, the hosts in nixos/, and the
# Stacks in komodo/stacks/, all in the private repo next to the inventory.
# nixos-sync.yml and komodo-sync.yml write the last two from the inventory, and
# this run stops at a host whose committed files are out of date. A new VM is
# blank and boots the installer ISO, which the pve role puts on each Proxmox
# host. A host that already runs NixOS is never installed again, so a second
# run only deploys what changed:
#
#   ansible-playbook site.yml -e target=ci01
#
# Nothing here runs on the hosts themselves. Every task runs on the control
# node, which needs nix, and sops with the age key that decrypts the private
# repo's secrets.
#
# See https://myah-mitchell.github.io/docs/fleet-bootstrap/concepts/how-a-host-is-built/
# for what each stage does, and
# https://myah-mitchell.github.io/docs/fleet-bootstrap/foundation/ for the setup
# this needs.

- name: Create missing VMs
  hosts: "{{ target }}"
  gather_facts: false
  become: false

  roles:
    - role: vms
      tags: vms

- name: Wait for the hosts to answer
  hosts: "{{ target }}"
  gather_facts: false
  become: false

  tasks:
    # A new VM answers once it has booted the installer, and a built one as
    # soon as it is up. Check mode stops at OpenTofu's plan, so there may be
    # no VM to wait for.
    - name: Wait for the host's SSH port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: "{{ site_boot_timeout | default(1800) }}"
      delegate_to: localhost
      when:
        - NIXOS | default(false) | bool
        - not ansible_check_mode
      tags: [ vms, wait ]

- name: Install and deploy NixOS
  hosts: "{{ target }}"
  gather_facts: false
  become: false

  roles:
    - role: nixos
      tags: nixos

- name: Deploy the stacks through Komodo
  hosts: "{{ target }}"
  gather_facts: false
  become: false

  roles:
    - role: komodo_stacks
      tags: komodo
