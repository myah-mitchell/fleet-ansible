all:
localhosts:
  hosts:
    ubuntu:
      ansible_host: 127.0.0.1

      ntp_service: "chrony"

      FIREWALL: true
      firewall_service: "ufw"

      SWAP: true
      swap_size: "512M"
      swap_file: "/swapfile"

      AUTOUPDATE: true
      NODE_EXPORTER: true

    wsl:
      ansible_host: 127.0.0.1

      AUDITD: false
      AUTOUPDATE: false
      DOCKER: false
      FAIL2BAN: false
      FIREWALL: false
      HOSTNAME: false
      LOGGING: false
      MAIL: false
      MONITORING: false
      NGINX: false
      NTP: false
      QEMU: false
      SSH: false
      SWAP: false
      USERS: true
      users_ansible_setup: false
      users_admin_setup: false
      users_root_setup: false
      VRRP: false

# NixOS VMs, which site.yml builds and nixos-sync.yml writes the NixOS data
# for. provision.yml never runs against them. The addresses are documentation
# addresses, so nixos-sync.yml can be tried against this file, and site.yml
# cannot reach anything.
nixos_host:
  hosts:
    ex01:
      ansible_host: 192.0.2.110
      serverHostname: "ex01"
      swap_size_mib: 512
      docker_stacks:
        - system-agent
        - traefik-agent
    ex02:
      ansible_host: 192.0.2.111
      serverHostname: "ex02"
      docker_stacks:
        - system-agent
        - traefik-agent
        - komodo-server

  vars:
    NIXOS: true
    network_gateway: "192.0.2.1"
    docker_stacks_internal_subnet: "192.0.2.0/24"

    short_name: "EXAMPLE"
    abbr_name: "ex"
    location_abbr: "h"
    domain_name: "example.com"

    FIREWALL: true
    DOCKER: true
    KOMODO: true
    NODE_EXPORTER: true

pbs_host:
  hosts:
    bk01:
      ansible_host: 127.0.0.1
      serverHostname: "bk01"

      NTP: true
      ntp_service: "chrony"

      PBS: true
      pbs_enterprise_repo: false
      pbs_interface_primary: "nic0"
      pbs_interface_secondary: ""

      NGINX: true

pmg_host:
  hosts:
    mx01:
      ansible_host: 127.0.0.1
      serverHostname: "mx01"

      NTP: true
      ntp_service: "chrony"

      PMG: true
      pmg_enterprise_repo: false
      pmg_interface_primary: "ens18"
      pmg_interface_secondary: ""

      NGINX: true

pve_host:
  hosts:
    vh01:
      ansible_host: 172.16.0.11
      serverHostname: "vh01"
      pve_interfaces:
        mgmt:
          ip: "172.16.0.11"
          cidr: "24"
          gw: "172.16.0.1"

  vars:
    NTP: true
    ntp_service: "chrony"

    PVE: true
    pve_enterprise_repo: false

    pve_interface_names:
      mgmt:
        primary: "enp26s0f0np0"

    NGINX: true
