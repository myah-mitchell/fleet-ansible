---
- name: Include PVE (Proxmox) Variables
  ansible.builtin.include_tasks: pve-vars.yml
  args:
    apply:
      become: true
  when: PVE
  tags:
    - pve-general
    - pve-passthrough
    - pve-network
    - pve-tls
    - pve-installer-iso

- name: Include PVE (Proxmox) General Setup Tasks
  ansible.builtin.include_tasks: pve.yml
  args:
    apply:
      become: true
  when: PVE
  tags:
    - pve-general

- name: Include PVE (Proxmox) PCIe Passthrough Tasks
  ansible.builtin.include_tasks: pve-passthrough.yml
  args:
    apply:
      become: true
  when: PVE
  tags:
    - pve-passthrough
- name: Include PVE (Proxmox) Network Setup Tasks
  ansible.builtin.include_tasks: pve-network.yml
  args:
    apply:
      become: true
  when: PVE
  tags:
    - pve-network

- name: Include PVE (Proxmox) Signed TLS Tasks
  ansible.builtin.include_tasks: pve-tls.yml
  args:
    apply:
      become: true
  when: PVE
  tags:
    - pve-tls

# The tasks work out from git whether the private repo has a NixOS fleet, and
# skip the ISO when it has none.
- name: Include Installer ISO Tasks
  ansible.builtin.include_tasks: pve-installer-iso.yml
  args:
    apply:
      tags:
        - pve-installer-iso
  when: PVE
  tags:
    - pve-installer-iso
