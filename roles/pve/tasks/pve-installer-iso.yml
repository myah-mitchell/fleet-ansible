---
# The ISO is built from the private repo as git has it: build-installer hands
# the flake the fleet as a git+file input, which sees the files git tracks and
# nothing else. So the fleet's files are looked up in git, not on disk. A repo
# with no nixos/fleet.json anywhere has no NixOS hosts, and gets no ISO.
- name: Find the fleet's files in git
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ inventory_dir }}"
      - ls-files
      - --
      - nixos/fleet.json
      - secrets/installer.yaml
  register: pve_installer_iso_tracked
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Say why no installer ISO is built
  ansible.builtin.debug:
    msg: >-
      {{ inventory_dir }} has no nixos/fleet.json, so this inventory has no
      NixOS fleet and no installer ISO is built.
  run_once: true
  when: not pve_installer_iso_fleet | bool

- name: Build the installer ISO and copy it to the PVE host
  when: pve_installer_iso_fleet | bool
  block:
    - name: Look for uncommitted changes to the fleet's files
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ inventory_dir }}"
          - status
          - --porcelain
          - --ignored
          - --
          - nixos/fleet.json
          - secrets/installer.yaml
      register: pve_installer_iso_status
      changed_when: false
      failed_when: false
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Check the fleet's files are committed
      ansible.builtin.assert:
        that:
          - pve_installer_iso_tracked.rc == 0
          - "'nixos/fleet.json' in pve_installer_iso_tracked.stdout_lines"
          - "'secrets/installer.yaml' in pve_installer_iso_tracked.stdout_lines"
          - pve_installer_iso_status.stdout | length == 0
        fail_msg: >-
          {% if pve_installer_iso_tracked.rc != 0 -%}
          {{ inventory_dir }} has a nixos/fleet.json but is not a git checkout
          ({{ pve_installer_iso_tracked.stderr | default('', true) | trim }}).
          The ISO is built from what git tracks, so the private repo has to be
          one.
          {% elif 'secrets/installer.yaml' not in pve_installer_iso_tracked.stdout_lines
                  and (inventory_dir ~ '/secrets/installer.yaml') is not file -%}
          {{ inventory_dir }} has no secrets/installer.yaml, the installer's
          SSH host key. Make it once with
          nix run <nixos-fleet>#new-installer-key -- --fleet {{ inventory_dir }},
          then git add and commit it.
          {% else -%}
          nixos/fleet.json and secrets/installer.yaml in {{ inventory_dir }}
          have to be committed, and git has them as untracked, changed or
          ignored
          ({{ pve_installer_iso_status.stdout_lines | map('trim') | join('; ') }}).
          The ISO is built from what git tracks, so git add and commit them.
          {%- endif %}
        quiet: true
      run_once: true

    # The nixos role's checkout of nixos-fleet and its settings, which the
    # build below uses.
    - name: Check out nixos-fleet
      ansible.builtin.include_role:
        name: nixos
        tasks_from: checkout
        public: true
        apply:
          tags:
            - pve-installer-iso

    # The build runs once, on the control node, for every PVE host in the
    # play. build-installer decrypts the fleet's installer host key, builds
    # the ISO with it, and prints the path of the ISO. nix builds nothing when
    # the flake, the fleet's files and the key are unchanged since the last
    # run. Check mode builds nothing, and so has nothing to copy.
    - name: Build the installer ISO on the control node
      ansible.builtin.command:
        argv:
          - "{{ nixos_nix }}"
          - run
          - "{{ nixos_local_checkout }}#build-installer"
          - "--"
          - --fleet
          - "{{ nixos_fleet_dir }}"
      register: pve_installer_iso_build
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true
      when: not ansible_check_mode

    # The ISO holds the installer's private host key, so only root reads it.
    # QEMU runs as root on Proxmox, and needs no more.
    - name: Copy the installer ISO to the PVE host
      ansible.builtin.copy:
        src: "{{ pve_installer_iso_build.stdout_lines | last }}"
        dest: "{{ pve_installer_iso_path }}"
        owner: root
        group: root
        mode: "0600"
      when: not ansible_check_mode

    - name: Say the ISO is left alone in check mode
      ansible.builtin.debug:
        msg: >-
          Check mode builds no installer ISO and copies none, so whether the
          ISO on {{ inventory_hostname }} is current is not checked.
      when: ansible_check_mode
