---
# The nixos role's checkout of nixos-fleet and its settings, which the build
# below uses.
- name: Check out nixos-fleet
  ansible.builtin.include_role:
    name: nixos
    tasks_from: checkout
    public: true
    apply:
      tags:
        - pve-installer-iso

# The build runs once, on the control node, for every PVE host in the play.
# build-installer decrypts the fleet's installer host key, builds the ISO
# with it, and prints the path of the ISO. nix builds nothing when the
# flake, the fleet's files and the key are unchanged since the last run.
- name: Build the installer ISO on the control node
  ansible.builtin.command:
    argv:
      - "{{ nixos_nix }}"
      - run
      - "{{ nixos_local_checkout }}#build-installer"
      - "--"
      - --fleet
      - "{{ nixos_fleet_dir }}"
  register: pve_installer_iso_build
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy the installer ISO to the PVE host
  ansible.builtin.copy:
    src: "{{ pve_installer_iso_build.stdout_lines | last }}"
    dest: "{{ pve_installer_iso_path }}"
    owner: root
    group: root
    mode: "0644"
