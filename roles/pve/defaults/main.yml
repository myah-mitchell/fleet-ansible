---
PVE: false
pve_group: "{{ target }}"
pve_base_dir: "/etc/pve"

# The installer ISO every new VM boots from, built from the fleet-nixos flake
# with the private repo as its fleet input, so it carries the fleet's admin SSH
# keys and its installer SSH host key. It is built once per run on the control
# node and copied to every PVE host's `local` storage, where OpenTofu's
# installer_iso finds it as local:iso/fleet-nixos-installer.iso. A VM only
# reads it until NixOS is installed, so replacing it never touches a running
# host.
#
# Skipped when the private repo has no nixos/fleet.json, so an inventory with
# no NixOS hosts needs no nix. Otherwise the run stops unless nixos/fleet.json
# is committed there: run nixos-sync.yml and commit what it writes.
pve_installer_iso_path: "/var/lib/vz/template/iso/fleet-nixos-installer.iso"

pve_enterprise_repo: false
pve_passthrough: true
pve_interface_names: []
#pve_interface_names:
#  mgmt:
#    primary: "ens1f1"
#    secondary: "ens1f0"
pve_interfaces:
  mgmt:
    ip: ""
    cidr: ""
    gw: ""
