---
# server_password and client_password are hashed here on the target rather than
# with password_hash on the controller. That filter needs passlib, and under
# Semaphore the controller is a stock container without it. openssl is already
# on every host this role manages.
#
# The salt is fixed per host, derived from its hostname. A random salt produces a
# different hash for the same password on every run, so the user module would
# rewrite /etc/shadow and report changed each time.
#
# An empty password is not hashed, and the accounts it belongs to keep the
# password they have.
- name: Hash the server and client passwords
  ansible.builtin.command:
    cmd: openssl passwd -6 -salt {{ _server_password_salt }} -stdin
    stdin: "{{ item.value }}"
  vars:
    _server_password_salt: "{{ (serverHostname | default(ansible_facts.hostname, true) | lower | hash('sha1'))[:16] }}"
  loop: >-
    {{ [{'name': 'server', 'value': server_password},
        {'name': 'client', 'value': client_password}]
       | selectattr('value', 'ne', '') | list }}
  loop_control:
    label: "{{ item.name }}"
  register: _server_password_hash_result
  changed_when: false
  check_mode: false
  no_log: true

# A malformed hash would be written to /etc/shadow and lock every account this
# role manages out of password login, so fail here instead.
- name: Check each password hash is sha512-crypt
  ansible.builtin.assert:
    that:
      - item.stdout | trim is match('^\$6\$[./0-9A-Za-z]{1,16}\$[./0-9A-Za-z]{86}$')
    fail_msg: openssl did not return a sha512-crypt hash. Check that this host's openssl supports passwd -6.
    quiet: true
  loop: "{{ _server_password_hash_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: "Setting Var: server_password_hash and client_password_hash"
  ansible.builtin.set_fact:
    "{{ item.item.name }}_password_hash": "{{ item.stdout | trim }}"
  loop: "{{ _server_password_hash_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true
