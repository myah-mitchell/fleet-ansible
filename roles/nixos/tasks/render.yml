---
# Renders the fleet's values and this host's description as the JSON files the
# nixos-fleet flake reads. nixos-sync.yml writes them for every NixOS host.
# site.yml only renders them in check mode, to find out whether the committed
# copies still match, and never writes them. Everything here runs on the
# control node.

# One file holds the fleet's values, so every NixOS host in the inventory has
# to give the same ones, not only the hosts in this play. Otherwise a run with
# --limit would write the file from the one host it was limited to. It runs
# first, before the identity tasks below set admin_name and the rest as facts
# for this play's hosts only, so hostvars hold what the inventory sets.
- name: Check every NixOS host in the inventory gives the same fleet values
  ansible.builtin.assert:
    that: nixos_fleet_mismatch | from_json | length == 0
    fail_msg: >-
      NixOS hosts in the inventory set these fleet values differently, shown
      with the hosts that give each value:
      {{ nixos_fleet_mismatch | from_json | join('; ') }}. nixos/fleet.json
      holds one value for every host, so set each of them once, under
      all: vars: or in group_vars/all/.
    quiet: true
  run_once: true
  when: not nixos_sync_check | default(false)

- name: Check the inventory sets what a NixOS host needs
  ansible.builtin.assert:
    that:
      - short_name | default('') | length > 0
      - abbr_name | default('') | length > 0
      - location_abbr is defined
      - domain_name | default('') | length > 0
      - network_gateway | default('') | length > 0
    fail_msg: >-
      {{ inventory_hostname }} needs short_name, abbr_name, location_abbr,
      domain_name and network_gateway, and only location_abbr may be empty.
      Set them in hosts.yml, on the host, its group, or under all: vars:.
    quiet: true

# The deploy keys are how site.yml reaches an installed host, and the admin
# keys how a person does. The installer ISO lets in both. With either list
# empty, a host has an account that nobody can log in to again.
- name: Check the admin and deploy SSH keys are set
  ansible.builtin.assert:
    that:
      - admin_ssh_public_keys | length > 0
      - ansible_ssh_public_keys | length > 0
    fail_msg: >-
      admin_ssh_public_keys and ansible_ssh_public_keys each need at least one
      SSH public key, or the host has an account nobody can log in to. Set
      them in the private repo's group_vars/all/private.yml.
    quiet: true

# The files, the flake's attribute and the secrets go by the inventory name,
# and the VM, the Komodo Server and the host's own hostName by serverHostname.
# Two different names would give one host two identities that nothing links.
- name: Check the inventory name is the host's name
  ansible.builtin.assert:
    that: inventory_hostname == nixos_host_name
    fail_msg: >-
      {{ inventory_hostname }} has serverHostname
      {{ serverHostname | default('') }}, which gives the host the name
      {{ nixos_host_name }}. Name the host in the inventory by its
      serverHostname in lower case, or set serverHostname to match.
    quiet: true

- name: Work out the names that follow from the identity values
  ansible.builtin.include_role:
    name: provision
    tasks_from: identity

- name: Start with no stacks
  ansible.builtin.set_fact:
    docker_stacks_list: []
    docker_stacks_setup: []
    nixos_stack_folders: []
    nixos_stack_files: []
    nixos_stack_firewall: []

- name: Work out the stacks this host runs
  ansible.builtin.include_role:
    name: stacks
    tasks_from: list
    public: true
  when: runs_stacks | bool

- name: Check the internal subnet is set when a rule needs it
  ansible.builtin.assert:
    that: docker_stacks_internal_subnet | default('') | length > 0
    fail_msg: >-
      A stack in {{ docker_stacks_list | join(', ') }} opens a port to the
      internal subnet. Set docker_stacks_internal_subnet to it in CIDR form.
    quiet: true
  when:
    - FIREWALL | bool
    - docker_stacks_setup | map(attribute='firewall') | flatten | selectattr('allow_from', 'equalto', 'internal') | list | length > 0

- name: Check docker_stacks_port_sources is a list
  ansible.builtin.assert:
    that:
      - docker_stacks_port_sources | default([]) is sequence
      - docker_stacks_port_sources | default([]) is not string
    fail_msg: docker_stacks_port_sources has to be a list of entries.
    quiet: true

- name: Check each port source names a port, a protocol and its sources
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.port | default('') is integer
      - item.proto | default('') in ['tcp', 'udp']
      - item.sources | default('') is sequence
      - item.sources | default('') is not string
      - item.sources | default([]) | length > 0
    fail_msg: >-
      Each entry of docker_stacks_port_sources needs port (a number), proto
      (tcp or udp) and sources (a list of IPv4 addresses or CIDRs). This one
      is {{ item }}.
    quiet: true
  loop: "{{ docker_stacks_port_sources | default([]) }}"
  loop_control:
    label: "{{ item.port | default('') }}/{{ item.proto | default('') }}"

# A mode is a string of octal digits. Unquoted in a setup.yaml, YAML reads it
# as a number, and the digits are lost before they get here.
- name: Check every mode is a string of octal digits
  ansible.builtin.assert:
    that: item.1.mode is string and item.1.mode is match('^[0-7]{3,4}$')
    fail_msg: >-
      {{ item.0.stack }} gives {{ item.1.path }} the mode {{ item.1.mode }}.
      Quote it in the container's setup.yaml in docker-stacks, as in "0750".
    quiet: true
  loop: >-
    {{ (docker_stacks_setup | subelements('folders'))
       + (docker_stacks_setup | subelements('files')) }}
  loop_control:
    label: "{{ item.0.project }}/{{ item.1.path }}"
  when: item.1.mode | default(none) is not none

- name: Work out each container's folders
  ansible.builtin.set_fact:
    nixos_stack_folders: "{{ nixos_stack_folders + [entry] }}"
  vars:
    entry: >-
      {{ {
        'project': item.0.project,
        'root': item.1.root,
        'path': item.1.path,
        'owner': item.1.owner,
        'group': item.1.group,
        'mode': item.1.mode | default(none)
      } }}
  loop: "{{ docker_stacks_setup | subelements('folders') }}"
  loop_control:
    label: "{{ item.1.root }}/{{ item.0.project }}/{{ item.1.path }}"

# The flake takes no docker-stacks input, so a seed file travels as its text.
# The host copies it into place only when nothing is there yet, which keeps a
# filled-in copy, such as mailrise.conf with its real token, from being
# replaced by the example.
# A seed file's text ends up in a committed host file and in the host's
# world-readable Nix store, so it has to come from docker-stacks' containers
# folder and nowhere else on the control node. realpath also follows links.
- name: Check each seed file comes from docker-stacks' containers folder
  ansible.builtin.assert:
    that:
      - >-
        (docker_stacks_local_checkout ~ '/' ~ item.1.source) | realpath
        is match((docker_stacks_local_checkout | realpath | regex_escape) ~ '/containers/')
    fail_msg: >-
      {{ item.0.project }}: the seed file source {{ item.1.source }} is not a
      file under containers/ in the docker-stacks checkout.
    quiet: true
  loop: "{{ docker_stacks_setup | subelements('files') }}"
  loop_control:
    label: "{{ item.0.project }}/{{ item.1.path }}"

- name: Read each container's seed files
  ansible.builtin.set_fact:
    nixos_stack_files: "{{ nixos_stack_files + [entry] }}"
  vars:
    entry: >-
      {{ {
        'project': item.0.project,
        'path': item.1.path,
        'owner': item.1.owner,
        'group': item.1.group,
        'mode': item.1.mode | default(none),
        'content': lookup('ansible.builtin.file', docker_stacks_local_checkout ~ '/' ~ item.1.source, rstrip=false)
      } }}
  loop: "{{ docker_stacks_setup | subelements('files') }}"
  loop_control:
    label: "{{ item.0.project }}/{{ item.1.path }}"

- name: Work out each container's firewall ports
  ansible.builtin.set_fact:
    nixos_stack_firewall: "{{ nixos_stack_firewall + [entry] }}"
  vars:
    entry: >-
      {{ {
        'port': item.1.port | int,
        'proto': item.1.proto,
        'allowFrom': item.1.allow_from,
        'comment': item.1.comment
      } }}
  loop: "{{ docker_stacks_setup | subelements('firewall') }}"
  loop_control:
    label: "{{ item.0.stack }}: {{ item.1.comment }} ({{ item.1.port }}/{{ item.1.proto }})"

# With the inventory in agreement, the file is written once, from the first
# host, and then compared with what every other host in the play gives.
- name: Write the fleet's file
  ansible.builtin.copy:
    content: "{{ nixos_fleet_data | to_nice_json(indent=2, sort_keys=true) }}\n"
    dest: "{{ nixos_sync_dir }}/fleet.json"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  when: not nixos_sync_check | default(false)

- name: Compare the fleet's file with this host's values
  ansible.builtin.copy:
    content: "{{ nixos_fleet_data | to_nice_json(indent=2, sort_keys=true) }}\n"
    dest: "{{ nixos_sync_dir }}/fleet.json"
    mode: "0644"
  register: nixos_fleet_file
  check_mode: true
  diff: true
  delegate_to: localhost
  become: false

- name: Write this host's file
  ansible.builtin.copy:
    content: "{{ nixos_host_data | to_nice_json(indent=2, sort_keys=true) }}\n"
    dest: "{{ nixos_sync_dir }}/hosts/{{ inventory_hostname }}.json"
    mode: "0644"
  register: nixos_host_file
  check_mode: "{{ (nixos_sync_check | default(false)) or ansible_check_mode }}"
  diff: "{{ nixos_sync_check | default(false) }}"
  delegate_to: localhost
  become: false
