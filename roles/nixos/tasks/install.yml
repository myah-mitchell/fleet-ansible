---
# host-state prints one word for the address: installer when the VM is booted
# from the installer ISO, installed when it runs the fleet's NixOS, and
# unreachable when nothing answers. Only the first gets an install, so a run
# against a host that is already built never reinstalls it.
- name: Ask what the host is running
  ansible.builtin.command:
    argv:
      - "{{ nixos_nix }}"
      - run
      - "{{ nixos_local_checkout }}#host-state"
      - "--"
      - --user
      - "{{ ansible_account }}"
      - "{{ nixos_address }}"
  register: nixos_host_state
  changed_when: false
  failed_when: nixos_host_state.stdout | trim not in ['installer', 'installed', 'unreachable']
  check_mode: false
  delegate_to: localhost
  become: false

# Check mode stops at OpenTofu's plan, so a host whose VM is new has nothing
# to answer yet.
- name: Check the host answers
  ansible.builtin.assert:
    that: nixos_host_state.stdout | trim != 'unreachable'
    fail_msg: >-
      {{ inventory_hostname }} answers at {{ nixos_address }} neither as the
      installer nor as an installed host. Check that its VM is running, that
      it booted from the installer ISO or from its disk, and that the control
      node's SSH key is one the installer and the {{ ansible_account }}
      account accept.
    quiet: true
  when: not ansible_check_mode

# install-host reads the installer's SSH host key through the Proxmox node
# that runs the VM, from the VM's guest agent, so it needs the VM's node and
# VMID, which the vms play noted from OpenTofu, and the node's own SSH host
# key, which the inventory pins as pve_ssh_host_key.
- name: Find the VM's Proxmox node
  ansible.builtin.set_fact:
    nixos_pve_node: "{{ vms_vm.node_name | default('', true) }}"
  when:
    - nixos_host_state.stdout | trim == 'installer'
    - not ansible_check_mode

- name: Check the VM's Proxmox node is known
  ansible.builtin.assert:
    that:
      - vms_vm is defined
      - vms_vm.vm_id | default('', true) | string | length > 0
      - nixos_pve_node in hostvars
      - hostvars[nixos_pve_node].pve_ssh_host_key | default('') is match('ssh-[a-z0-9-]+ [A-Za-z0-9+/]+=* *$')
    fail_msg: >-
      {% if vms_vm is not defined or vms_vm.vm_id | default('', true) | string | length == 0 -%}
      {{ inventory_hostname }} runs the installer, but this run does not know
      its VM. The vms play notes the VM's node and VMID from OpenTofu, so run
      site.yml with the vms tag as well.
      {%- elif nixos_pve_node not in hostvars -%}
      The VM of {{ inventory_hostname }} runs on the Proxmox node
      {{ nixos_pve_node }}, which is not in the inventory. Add it to pve_host
      with its ansible_host.
      {%- else -%}
      {{ nixos_pve_node }} has no pve_ssh_host_key in the inventory. Set it to
      the node's SSH host key, the contents of
      /etc/ssh/ssh_host_ed25519_key.pub on the node, read at its console.
      {%- endif %}
    quiet: true
  when:
    - nixos_host_state.stdout | trim == 'installer'
    - not ansible_check_mode

# The install partitions the OS and Docker disks, prepares the persistent
# disk without formatting one that already holds a filesystem, puts the
# host's SSH keys on it, installs NixOS, and reboots. Evaluating a host takes
# about 1 GB of memory on the control node, more than once per install, so
# the hosts go one at a time, which keeps Semaphore's container inside its
# memory limit.
- name: Install NixOS
  ansible.builtin.command:
    argv:
      - "{{ nixos_nix }}"
      - run
      - "{{ nixos_local_checkout }}#install-host"
      - "--"
      - --fleet
      - "{{ nixos_fleet_dir }}"
      - --build-on
      - "{{ nixos_build_on }}"
      - --proxmox
      - "{{ hostvars[nixos_pve_node].ansible_account | default(ansible_account) }}@{{ hostvars[nixos_pve_node].ansible_host | default(nixos_pve_node) }}"
      - --proxmox-host-key
      - "{{ hostvars[nixos_pve_node].pve_ssh_host_key }}"
      - --vmid
      - "{{ vms_vm.vm_id }}"
      - "{{ inventory_hostname }}"
      - "{{ nixos_address }}"
  changed_when: true
  delegate_to: localhost
  become: false
  throttle: 1
  when:
    - nixos_host_state.stdout | trim == 'installer'
    - not ansible_check_mode

- name: Wait for the host to boot into NixOS
  ansible.builtin.command:
    argv:
      - "{{ nixos_nix }}"
      - run
      - "{{ nixos_local_checkout }}#host-state"
      - "--"
      - --user
      - "{{ ansible_account }}"
      - "{{ nixos_address }}"
  register: nixos_host_state_installed
  changed_when: false
  failed_when: false
  until: nixos_host_state_installed.stdout | trim == 'installed'
  retries: "{{ nixos_install_retries }}"
  delay: "{{ nixos_install_delay }}"
  delegate_to: localhost
  become: false
  when:
    - nixos_host_state.stdout | trim == 'installer'
    - not ansible_check_mode

- name: Check the host booted into NixOS
  ansible.builtin.assert:
    that: nixos_host_state_installed.stdout | trim == 'installed'
    fail_msg: >-
      The install finished, but {{ inventory_hostname }} still answers at
      {{ nixos_address }} as
      {{ nixos_host_state_installed.stdout | trim | default('nothing', true) }}.
      Its console in Proxmox shows how far the boot got.
    quiet: true
  when:
    - nixos_host_state.stdout | trim == 'installer'
    - not ansible_check_mode
