---
# Builds the host's configuration and switches to it. In check mode it runs
# dry-build instead, which evaluates the configuration on the control node and
# prints what would be built, and neither builds anything nor reaches the host.
# A host that is not installed yet in check mode is left out. Like the
# install, it evaluates the host on the control node, so one host at a time.
- name: Deploy the host's NixOS configuration
  ansible.builtin.command:
    argv:
      - "{{ nixos_nix }}"
      - run
      - "{{ nixos_local_checkout }}#deploy-host"
      - "--"
      - --fleet
      - "{{ nixos_fleet_dir }}"
      - --user
      - "{{ ansible_account }}"
      - --build-on
      - "{{ nixos_build_on }}"
      - --action
      - "{{ 'dry-build' if ansible_check_mode else 'switch' }}"
      - "{{ inventory_hostname }}"
      - "{{ nixos_address }}"
  changed_when: not ansible_check_mode
  check_mode: false
  delegate_to: localhost
  become: false
  throttle: 1
  when: not ansible_check_mode or nixos_host_state.stdout | trim == 'installed'
