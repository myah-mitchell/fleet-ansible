---
nixos_nix: "{{ nixos_nix_binary if nixos_nix_binary | length > 0 else nixos_nix_lookup.stdout }}"
nixos_sync_dir: "{{ inventory_dir }}/nixos"
nixos_address: "{{ ansible_host | default(inventory_hostname) }}"
nixos_host_name: "{{ serverHostname | default(inventory_hostname, true) | lower }}"


# Written as single expressions, so every number, boolean and list keeps its
# type on the way into the JSON.
nixos_fleet_data: >-
  {{ {
    'shortName': short_name,
    'abbrName': abbr_name,
    'locationAbbr': location_abbr | default('', true),
    'domainName': domain_name,
    'locationDomain': location_domain_name,
    'timeZone': ntp_timezone,
    'adminName': admin_name,
    'adminList': admin_list,
    'clientAccount': client_account,
    'deployAccount': ansible_account,
    'adminSshKeys': admin_ssh_public_keys,
    'deploySshKeys': ansible_ssh_public_keys,
    'clientSshKeys': client_ssh_public_keys,
    'caCertificates': ca_certificates,
    'ntpServers': ntp_servers,
    'sshBannerName': ssh_legal_banner_name,
    'sshBannerBody': ssh_legal_banner_body,
    'komodoCoreAddress': komodo_core_address,
    'komodoCorePublicKey': komodo_core_public_key
  } }}

# The variables nixos_fleet_data is made from, and the ones it follows from.
# Keep the two in step.
nixos_fleet_inputs:
  - short_name
  - abbr_name
  - location_abbr
  - domain_name
  - location_domain_name
  - ntp_timezone
  - admin_name
  - admin_list
  - client_account
  - ansible_account
  - admin_ssh_public_keys
  - ansible_ssh_public_keys
  - client_ssh_public_keys
  - ca_certificates
  - ntp_servers
  - ssh_legal_banner_name
  - ssh_legal_banner_body
  - komodo_core_address
  - komodo_core_public_key

# Each of those that the NixOS hosts in the whole inventory do not all set to
# the same value, with the hosts grouped by the value they give, as a JSON
# list, since a template with more than one statement renders to text. Read from
# hostvars, which hold what the inventory sets and no role default, so a
# variable no host sets counts as one value, and one that some hosts set and
# others leave to the default counts as two.
nixos_fleet_mismatch: >-
  {%- set hosts = [] -%}
  {%- for host in groups['all'] if hostvars[host].NIXOS | default(false) | bool -%}
    {{- hosts.append(host) or '' -}}
  {%- endfor -%}
  {%- set found = [] -%}
  {%- for name in nixos_fleet_inputs -%}
    {%- set by_value = {} -%}
    {%- for host in hosts -%}
      {%- set value = hostvars[host][name] | to_json if name in hostvars[host] else '(not set)' -%}
      {{- by_value.update({value: by_value.get(value, []) + [host]}) or '' -}}
    {%- endfor -%}
    {%- if by_value | length > 1 -%}
      {{- found.append(name ~ ' (' ~ (by_value.values() | map('join', ', ') | join(' / ')) ~ ')') or '' -}}
    {%- endif -%}
  {%- endfor -%}
  {{ found | to_json }}
nixos_host_data: >-
  {{ {
    'hostName': nixos_host_name,
    'network': {
      'interface': network_interface,
      'address': nixos_address,
      'prefixLength': network_prefix_length | int,
      'gateway': network_gateway,
      'dns': network_dns
    },
    'features': {
      'firewall': FIREWALL | bool,
      'docker': DOCKER | bool,
      'komodo': KOMODO | bool,
      'nodeExporter': NODE_EXPORTER | bool,
      'fail2ban': FAIL2BAN | bool,
      'auditd': AUDITD | bool,
      'mail': MAIL | bool,
      'mosh': MOSH | bool
    },
    'swapMiB': swap_size_mib | int,
    'internalSubnet': docker_stacks_internal_subnet | default(''),
    'stacks': {
      'names': docker_stacks_list,
      'projects': docker_stacks_setup | map(attribute='project') | unique | list,
      'folders': nixos_stack_folders | unique | list,
      'files': nixos_stack_files | unique | list,
      'firewall': nixos_stack_firewall | unique | list
    }
  } }}
