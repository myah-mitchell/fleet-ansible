---
- name: Clone/update dotfiles repo on the control node
  ansible.builtin.git:
    repo: "{{ dotfiles_repo_url }}"
    dest: "{{ dotfiles_local_checkout }}"
    version: "{{ dotfiles_repo_version }}"
    accept_hostkey: true
  delegate_to: localhost
  become: false
  check_mode: false
  run_once: true

- name: Ensure target user's GitHub directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_remote_path }}"
    state: directory
    owner: "{{ dotfiles_target_user }}"
    group: "{{ dotfiles_target_user }}"
    mode: '0755'
  become: true
  become_user: "{{ dotfiles_target_user }}"

# .git is included on purpose: the repo is public HTTPS with no credentials
# involved, so there's nothing sensitive in it, and shipping it lets the
# target user run their own `git pull` against it if they want to update
# between ansible runs. That's purely a convenience for them — ansible still
# owns the source of truth and re-syncs from its own control-node checkout
# (above) on every run regardless of what the target user has done locally.
#
# Idempotency notes for the rsync_opts below — without them this task
# reports "changed" on every single run even when nothing meaningful moved:
#   --checksum        .git/HEAD, .git/index and .git/FETCH_HEAD are
#                      byte-identical between the control-node checkout and
#                      the target on a no-op run, but ansible.builtin.git's
#                      fetch step still touches their mtimes locally even
#                      when nothing new was fetched. The default quick
#                      check (size+mtime) sees that mtime drift and
#                      re-transfers them; comparing content instead makes
#                      that a real no-op.
#   --omit-dir-times   Same idea for directories (.git/, .git/objects/,
#                      .git/refs/**) — silences pure mtime bumps that carry
#                      no real content change.
#   --no-perms         install.sh (below) intentionally chmods
#                      ~/.ssh/config to 600 for OpenSSH's strict-perms
#                      requirement. Since it's a symlink into this tree,
#                      that mutates the real file's mode here to 600 vs
#                      git's tracked 644. With -p active that looked like
#                      drift and got forced back to 644 every run, which
#                      install.sh then re-tightened — forever. Dropping -p
#                      stops rsync fighting that chmod (new files still
#                      get git's executable bit per rsync's default
#                      behavior, so install.sh/git-filters/*.sh stay
#                      executable on a first deploy).
#   exclude .git/config, .git/logs/, zellij/.config/zellij/config.kdl
#                      Each of these is legitimately rewritten locally on
#                      the target every run — git filter registration,
#                      the reflog, and the homepath-filtered config
#                      respectively (see install.sh's "Registering
#                      homepath git filter" section) — so syncing the
#                      control-node's version over them just undoes that
#                      work, which then gets redone, forever. .git/config
#                      is seeded once below instead of synced every run;
#                      .git/logs/ isn't needed for the target user's own
#                      `git pull` to work and is left unpopulated; the
#                      zellij config is always freshly regenerated by
#                      install.sh's own checkout-index step regardless of
#                      what's shipped here.
- name: Push dotfiles tree to this host
  ansible.posix.synchronize:
    src: "{{ dotfiles_local_checkout }}/"
    dest: "{{ dotfiles_remote_path }}/"
    delete: false
    rsync_opts:
      - --checksum
      - --omit-dir-times
      - --no-perms
      - --exclude=.git/config
      - --exclude=.git/logs/
      - --exclude=zellij/.config/zellij/config.kdl
  become: true
  become_user: "{{ dotfiles_target_user }}"

# Excluded from the sync above (it's rewritten locally every run by
# install.sh's filter registration — see that script's "Registering
# homepath git filter" section), so it's seeded here exactly once instead.
# force: false means this never overwrites an existing .git/config, so
# install.sh's local filter.* entries persist across runs instead of being
# clobbered and immediately re-added in a loop.
#
# Trade-off: if dotfiles_repo_url ever changes (e.g. forking to a new
# github_user), a host that already has .git/config seeded keeps pointing
# at the old origin until that file is removed by hand and this re-seeds.
- name: Seed dotfiles .git/config on first deploy only
  ansible.builtin.copy:
    src: "{{ dotfiles_local_checkout }}/.git/config"
    dest: "{{ dotfiles_remote_path }}/.git/config"
    force: false
    owner: "{{ dotfiles_target_user }}"
    group: "{{ dotfiles_target_user }}"
    mode: '0644'
  become: true
  become_user: "{{ dotfiles_target_user }}"

# No flags: --windows (Windows/Alacritty PowerShell setup) and --claude (the
# Claude Code stack) are both opt-in as of dotfiles' install.sh. The hosts
# provision.yml runs against are servers, not WSL2, and servers/shared boxes
# are meant to skip both by default (see CLAUDE.md's Flags section), so the
# plain, flag-less run already does the right thing.
# No --cargo: cargo_install() already tries cargo-binstall (prebuilt binary)
# before falling back to compiling from source (see dotfiles/install.sh and
# CLAUDE.md).
- name: Run install.sh as the target user
  ansible.builtin.command:
    cmd: "{{ dotfiles_remote_path }}/install.sh"
    chdir: "{{ dotfiles_remote_path }}"
  become: true
  become_user: "{{ dotfiles_target_user }}"
  environment:
    HOME: "/home/{{ dotfiles_target_user }}"
  register: dotfiles_install_result
  changed_when: "'[✓]' in dotfiles_install_result.stdout"
