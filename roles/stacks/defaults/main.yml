---
#### STACKS role works out which docker-stacks stacks a host runs, and what
#### each one needs from the host: the runtime folders, seeded config files,
#### and firewall ports that the stack's containers list in their setup.yaml.
#### Everything runs on the control node. nixos-sync.yml carries the result to
#### the host's NixOS configuration, and komodo-sync.yml to Komodo, which
#### deploys the stacks.

# Stacks this host runs, by folder name under stacks/ in docker-stacks. Set it
# per host in the inventory, or pass it with -e as a list or a comma-separated
# string.
docker_stacks: []

# {{ github_user }}/docker-stacks is public, so plain HTTPS with no credential.
docker_stacks_repo_url: "https://github.com/{{ github_user }}/docker-stacks.git"
docker_stacks_repo_version: "main"
# Checked out once per play on the control node, where the setup files and the
# seeded config files are read from.
docker_stacks_local_checkout: "/tmp/ansible-docker-stacks-checkout"

# True only while the site is still being built and the fleet services a host's
# real stacks need are not up yet. The role then leaves out every stack whose
# setup.yaml still lists a needs_fleet service: system-agent, which writes to
# the VictoriaMetrics backends, and traefik-agent, which wants tf01's Redis.
# Set it on the host in the inventory, so its docker_stacks can hold the
# finished stack list from the day the host is created, and remove it at the
# handover. nixos-sync.yml and komodo-sync.yml both read it, so run both again
# and commit what they write after changing it; site.yml stops if they
# disagree.
docker_stacks_bootstrap: false

# Stands in for a service that the dropped stacks would have provided, keyed by
# the needs_host name nothing left on the host answers to. Used only on a
# bootstrapping run, and only when no stack still listed provides that service.
# Empty adds nothing, which makes an unmet need an error instead.
docker_stacks_standins:
  traefik: "traefik-bootstrap"

# CIDR that firewall rules marked `allow_from: internal` are scoped to. Required
# once any listed stack has such a rule, and nixos-sync.yml stops before writing
# anything if it is empty.
docker_stacks_internal_subnet: ""

# More addresses for one port that a listed stack opens to the internal subnet,
# for a host outside the subnet that needs that port and no other. Each entry
# names the port and proto of such a rule and the IPv4 addresses or CIDRs that
# may also connect to it:
#   - port: 6379
#     proto: tcp
#     sources: ["198.51.100.20/32"]
# An entry that matches no internal rule on the host stops the NixOS build.
docker_stacks_port_sources: []
