---
# The VM's name in the variables file, the same one Proxmox shows.
- name: Work out this host's VM name
  ansible.builtin.set_fact:
    vms_name: "{{ serverHostname | default(inventory_hostname, true) | lower }}"

# These blocks run once, on the control node, for every host in the play. The
# play's hosts may not exist yet, so nothing may connect to them.
- name: Prepare OpenTofu on the control node
  delegate_to: localhost
  run_once: true
  become: false
  block:
    - name: Check the environment OpenTofu reads is set
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', item) | length > 0
        fail_msg: >-
          {{ item }} is not set. OpenTofu reads it from the environment of the
          ansible-playbook process, so set it there (in Semaphore, as a secret
          in the Template's Environment).
        quiet: true
      loop: "{{ vms_required_env + (['PG_CONN_STR'] if vms_backend == 'pg' else []) }}"

    - name: Clone/update opentofu on the control node
      ansible.builtin.git:
        repo: "{{ vms_repo_url }}"
        dest: "{{ vms_local_checkout }}"
        version: "{{ vms_repo_version }}"
        depth: 1
        force: true
      # A scratch checkout on the control node, needed for a check-mode plan
      # too. Updating it changes nothing this run manages, so it never reports
      # a change.
      check_mode: false
      changed_when: false

    - name: Find the tofu binary
      ansible.builtin.command:
        cmd: sh -c 'command -v tofu'
      register: vms_tofu_lookup
      changed_when: false
      check_mode: false
      when: vms_tofu_binary | length == 0

    # Copied in as an auto-loaded file rather than passed with -var-file, since
    # the providers are made per server, and the collection runs commands
    # such as providers schema that need the variables but get no -var-file.
    - name: Copy the variables file into the checkout
      ansible.builtin.copy:
        src: "{{ vms_var_file }}"
        dest: "{{ vms_project_path }}/private.auto.tfvars"
        mode: "0600"
      check_mode: false

    # The configuration declares a pg backend. An override file swaps it for a
    # local one, and is removed again for a pg run in case an earlier local run
    # left it behind in the same checkout.
    - name: Create the local state folder
      ansible.builtin.file:
        path: "{{ vms_local_state_dir }}"
        state: directory
        mode: "0700"
      check_mode: false
      when: vms_backend == 'local'

    - name: Choose the state backend
      ansible.builtin.copy:
        dest: "{{ vms_project_path }}/backend_override.tf"
        content: |
          terraform {
            backend "local" {
              path = "{{ vms_local_state_dir }}/{{ vms_env }}.tfstate"
            }
          }
        mode: "0600"
      check_mode: false
      when: vms_backend == 'local'

    - name: Remove the local backend override
      ansible.builtin.file:
        path: "{{ vms_project_path }}/backend_override.tf"
        state: absent
      check_mode: false
      when: vms_backend != 'local'

    # The network each VM gets is an input, in the variables file, so it is
    # read and checked before the apply, and in check mode too.
    - name: Initialise OpenTofu
      ansible.builtin.command:
        cmd: "{{ vms_tofu }} init -input=false -reconfigure"
        chdir: "{{ vms_project_path }}"
      changed_when: false
      check_mode: false

    - name: Read each VM's network from the variables file
      ansible.builtin.command:
        cmd: "{{ vms_tofu }} console"
        chdir: "{{ vms_project_path }}"
        stdin: >-
          jsonencode({ for name, vm in var.vms : name => {
          address = vm.ipv4_address, gateway = vm.ipv4_gateway, dns = vm.dns_servers } })
      register: vms_networks
      changed_when: false
      check_mode: false

# The network is written twice, once for OpenTofu, which hands it to the
# installer, and once in the inventory, which the installed host is built from.
# A mismatch is caught here, before the VM is made, rather than as a VM that
# answers while it installs and is gone after its first boot, or that installs
# with one nameserver and boots with another. The nixos role's defaults for
# network_prefix_length and network_dns are repeated here, since its defaults
# stay in its play. A VM with no dns_servers gets none from cloud-init, and is
# not compared. One mismatch stops the run for every host, so no VM is made.
- name: Check the VM's network matches the inventory
  ansible.builtin.assert:
    that:
      - vms_network.address == (ansible_host | default(inventory_hostname)) ~ '/' ~ (network_prefix_length | default(24))
      - vms_network.gateway == network_gateway | default('')
      - vms_network.dns | length == 0 or vms_network.dns == network_dns | default([network_gateway | default('')])
    fail_msg: >-
      The variables file gives {{ vms_name }} the address {{ vms_network.address }},
      the gateway {{ vms_network.gateway }} and the nameservers
      {{ vms_network.dns | join(', ') if vms_network.dns else 'none' }}. The inventory gives it
      {{ ansible_host | default('no ansible_host') }}/{{ network_prefix_length | default(24) }},
      {{ network_gateway | default('no network_gateway') }} and
      {{ network_dns | default([network_gateway | default('')]) | join(', ') }}.
      Make the two agree.
    quiet: true
  vars:
    vms_network: "{{ (vms_networks.stdout | from_json | from_json)[vms_name] }}"
  when: vms_name in (vms_networks.stdout | from_json | from_json)
  any_errors_fatal: true

- name: Apply the VMs through OpenTofu
  delegate_to: localhost
  run_once: true
  become: false
  block:
    # Every host in the play is a target, by its VM name. A host the variables
    # file has no VM for matches nothing, and the file's other VMs are left
    # alone until a play targets them. check_destroy refuses any plan that
    # would destroy something, on top of the module's own prevent_destroy. In
    # check mode this stops at a plan.
    - name: Apply the configuration for this play's VMs
      cloud.terraform.terraform:
        binary_path: "{{ vms_tofu }}"
        project_path: "{{ vms_project_path }}"
        state: present
        force_init: true
        init_reconfigure: true
        check_destroy: true
        targets: >-
          {{ ansible_play_hosts_all | map('extract', hostvars, 'vms_name')
             | map('regex_replace', '^', 'module.vm["') | map('regex_replace', '$', '"]') | list }}

    # The vms output lists every VM in the variables file, created or not.
    # Only a real apply writes it, so a check-mode run sees it as of the last
    # one.
    - name: Read the VMs OpenTofu knows
      ansible.builtin.command:
        cmd: "{{ vms_tofu }} output -json"
        chdir: "{{ vms_project_path }}"
      register: vms_output
      changed_when: false
      check_mode: false

- name: Note this host's VM
  ansible.builtin.set_fact:
    vms_vm: "{{ vms_known[vms_name] }}"
  vars:
    vms_known: "{{ (vms_output.stdout | from_json).vms.value | default({}) }}"
  when: vms_name in vms_known
